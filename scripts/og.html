<!doctype html>
<!-- Link-preview image (og:image, 1200×630) in the site's style. Rendered to PNG by scripts/og.mjs:
     og.html?lang=uk → src/static/og-uk.png, ?lang=en → og-en.png. Tokens copied from src/css/style.css. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=block">
<style>
  :root {
    --bg: #161616;
    --surface: #1c1c1c;
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.14);
    --fill: rgba(255, 255, 255, 0.06);
    --text: #ffffff;
    --text-2: rgba(255, 255, 255, 0.7);
    --text-3: rgba(255, 255, 255, 0.48);
    --accent: #0099ff;
    --accent-soft: rgba(0, 153, 255, 0.14);
    --green: #3ddc97;
    --green-soft: rgba(61, 220, 151, 0.12);
    --pill: 100px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: radial-gradient(900px 620px at 92% 18%, rgba(0, 153, 255, 0.2), transparent 60%), var(--bg);
    color: var(--text); font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: 'cv11', 'ss01'; -webkit-font-smoothing: antialiased;
  }

  /* radar: rings, a sweep and a few "new startup" blips, fading out towards the text */
  .radar {
    position: absolute; right: -150px; top: 15px; width: 640px; height: 640px;
    -webkit-mask-image: linear-gradient(to left, #000 55%, transparent 100%);
  }
  .ring { position: absolute; inset: 0; margin: auto; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.07); }
  .sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 300deg, rgba(0, 153, 255, 0) 0deg, rgba(0, 153, 255, 0.05) 40deg, rgba(0, 153, 255, 0.34) 74deg, rgba(0, 153, 255, 0) 75deg);
  }
  .axis { position: absolute; background: rgba(255, 255, 255, 0.05); }
  .blip { position: absolute; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(0, 153, 255, 0.16), 0 0 28px 6px rgba(0, 153, 255, 0.55); }
  .blip.dim { background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.06); }

  .content { position: absolute; left: 72px; top: 60px; bottom: 56px; width: 760px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .logo svg { width: 38px; height: 38px; color: var(--accent); }
  .eyebrow {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
    margin-top: 44px; padding: 9px 20px; border-radius: var(--pill);
    background: var(--fill); border: 1px solid var(--line); color: var(--text-2); font-size: 20px;
  }
  .eyebrow svg { width: 18px; height: 18px; color: var(--accent); }
  h1 { margin-top: 26px; font-size: 76px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 600; }
  .lead { margin-top: 22px; max-width: 720px; font-size: 26px; line-height: 1.4; color: var(--text-2); }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .badges { display: flex; gap: 10px; }
  .badge {
    display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: var(--pill);
    font-size: 20px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line); background: var(--fill); color: var(--text-2);
  }
  .b-freemium { background: var(--accent-soft); color: #6cc4ff; border-color: rgba(0, 153, 255, 0.3); }
  .a-noauth { background: var(--green-soft); color: var(--green); border-color: rgba(61, 220, 151, 0.25); }
  .b-new { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .domain { position: absolute; right: 72px; bottom: 64px; font-size: 20px; color: var(--text-3); }
</style>
</head>
<body>
  <div class="radar" aria-hidden="true">
    <div class="sweep"></div>
    <div class="ring" style="width: 640px; height: 640px"></div>
    <div class="ring" style="width: 480px; height: 480px"></div>
    <div class="ring" style="width: 320px; height: 320px"></div>
    <div class="ring" style="width: 160px; height: 160px"></div>
    <div class="axis" style="left: 0; right: 0; top: 319px; height: 1.5px"></div>
    <div class="axis" style="top: 0; bottom: 0; left: 319px; width: 1.5px"></div>
    <div class="blip" style="left: 226px; top: 118px; width: 16px; height: 16px"></div>
    <div class="blip" style="left: 138px; top: 254px; width: 11px; height: 11px"></div>
    <div class="blip dim" style="left: 404px; top: 446px; width: 9px; height: 9px"></div>
    <div class="blip dim" style="left: 452px; top: 196px; width: 8px; height: 8px"></div>
    <div class="blip dim" style="left: 286px; top: 520px; width: 7px; height: 7px"></div>
  </div>

  <main class="content">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 19 5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
      <span>AI Radar</span>
    </div>
    <p class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      <span data-t="eyebrow"></span>
    </p>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="foot">
      <div class="badges">
        <span class="badge b-freemium" data-t="free"></span>
        <span class="badge a-noauth" data-t="noauth"></span>
        <span class="badge b-new" data-t="new"></span>
        <span class="badge">API</span>
      </div>
    </div>
  </main>
  <p class="domain">ai-radar-tech.netlify.app</p>

  <script>
    // Same wording as the site (src/js/i18n.js).
    const TEXT = {
      uk: { eyebrow: 'Каталог нових AI-інструментів', h1: 'AI-інструмент для будь-якої задачі', lead: 'Музика, відео, лого, ретуш — з позначками ціни й реєстрації та новими стартапами в кожній ніші', free: 'Free / freemium', noauth: 'Без реєстрації', new: 'Новий' },
      en: { eyebrow: 'Directory of new AI tools', h1: 'AI tool for any task', lead: 'Music, video, logos, retouching — labelled by pricing and sign-up, with the newest startups in every niche', free: 'Free / freemium', noauth: 'No sign-up', new: 'New' },
    };
    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'uk';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = TEXT[lang][el.dataset.t]; });
  </script>
</body>
</html>
